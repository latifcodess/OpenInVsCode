name: OpenInVSCode
options:
  bundleIdPrefix: ch.latifcodess
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    DEVELOPMENT_TEAM: 79W4JUNG7Y
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "3"
targets:
  OpenInVSCode:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes: ["LaunchAgents/**"]
      - path: Shared
      - path: App/LaunchAgents/ch.latifcodess.OpenInVSCode.LoginAgent.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.latifcodess.OpenInVSCode
        PRODUCT_NAME: Open in VS Code
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Open in VS Code
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: ""
    entitlements:
      # Pas de sandbox pour l'app hôte : elle doit pouvoir se remplacer lors d'une mise à jour.
      path: App/OpenInVSCode.entitlements
      properties:
        com.apple.security.application-groups:
          - 79W4JUNG7Y.ch.latifcodess.OpenInVSCode
    dependencies:
      - target: FinderExtension
        embed: true
  FinderExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: FinderExtension
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.latifcodess.OpenInVSCode.FinderExtension
        PRODUCT_NAME: FinderExtension
    info:
      path: FinderExtension/Info.plist
      properties:
        CFBundleDisplayName: Open in VS Code
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        NSExtension:
          NSExtensionAttributes: {}
          NSExtensionPointIdentifier: com.apple.FinderSync
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FinderSync
    entitlements:
      path: FinderExtension/FinderExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.application-groups:
          - 79W4JUNG7Y.ch.latifcodess.OpenInVSCode
schemes:
  OpenInVSCode:
    build:
      targets:
        OpenInVSCode: all
        FinderExtension: all
    run:
      config: Debug
    archive:
      config: Release
